[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aforo"
version = "0.1.0"
description = "Predicción de clientes por hora de un local, con MLflow, FastAPI y Docker"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::UserWarning:mlflow.*"]
